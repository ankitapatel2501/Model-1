<!DOCTYPE html>
<html>
<head>
<title>Login Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<iframe src="header.html" height="100"></iframe>
<section class="section">
<h2 class="section-title">Account</h2>
<div class="auth-container">
<div class="auth-buttons">
<button class="switch-btn active-btn" onclick="showLogin()">Login</button>
<button class="switch-btn" onclick="showRegister()">Register</button>
</div>
<form id="login-form" class="auth-form">
<input type="email" id="login-email" placeholder="Enter Email">
<input type="password" id="login-password" placeholder="Enter Password">
<button type="button" class="btn" onclick="loginUser()">Login</button>
<p class="bottom-text">
Don't have account?
<span onclick="showRegister()">Register</span>
</p>
</form>
<form id="register-form" class="auth-form" style="display:none;">
<input type="text" id="register-name" placeholder="Full Name">
<input type="email" id="register-email" placeholder="Email">
<input type="password" id="register-password" placeholder="Password">
<button type="button" class="btn" onclick="registerUser()">Register</button>
<p class="bottom-text">
Already have account?
<span onclick="showLogin()">Login</span>
</p>
</form>
</div>
</section>
<script>
function showLogin(){
document.getElementById("login-form").style.display="block"
document.getElementById("register-form").style.display="none";
document.querySelectorAll(".switch-btn")[0].classList.add("active-btn");
document.querySelectorAll(".switch-btn")[1].classList.remove("active-btn");
}
function showRegister(){
document.getElementById("login-form").style.display="none";
document.getElementById("register-form").style.display="block";
document.querySelectorAll(".switch-btn")[1].classList.add("active-btn");
document.querySelectorAll(".switch-btn")[0].classList.remove("active-btn");
}
function registerUser(){
let name=document.getElementById("register-name").value;
let email=document.getElementById("register-email").value;
let password=document.getElementById("register-password").value;
if(localStorage.getItem(email)){
alert("Account Already Exists");
}
else{
let userData={
name:name,
email:email,
password:password
};
localStorage.setItem(email,JSON.stringify(userData));
alert("Registration Successful");
showLogin();
}
}
function loginUser(){
let email=document.getElementById("login-email").value;
let password=document.getElementById("login-password").value;
let user=localStorage.getItem(email);
if(user==null){
alert("Account Not Found");
}
else{
let data=JSON.parse(user);
if(data.password==password){
alert("Login Successful");
window.location.href="home.html";
}
else{
alert("Wrong Password");
}
}
}
</script>
<iframe src="footer.html" height="220"></iframe>
</body>
</html>
