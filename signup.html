<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>SoloLearn Signup</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
<div class="container">
    <div class="left">
        <h1>SoloLearn</h1>
        <p>
            Start your coding journey today and
            learn programming with interactive lessons.
        </p>
        <img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png">
    </div>
    <div class="right">
        <div class="signup-box">
            <h2>Create Account</h2>
            <form id="signupForm">
                <div class="input-box">
                    <input type="text"
                    id="name"
                    placeholder="Full Name"
                    required>
                </div>

                <div class="input-box">
                    <input type="email"
                    id="email"
                    placeholder="Email Address"
                    required>
                </div>
                <div class="input-box">
                    <input type="password"
                    id="password"
                    placeholder="Password"
                    required>
                </div>
                <div class="input-box">
                    <input type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>
                </div>
                <button type="submit">
                    Sign Up
                </button>
            </form>
            <div class="social">
                <p>Or Sign Up With</p>
                <div class="icons">
                    <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">
                </div>
            </div>
            <div class="login-link">
                <p>
                    Already have an account?
                    <a href="#">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script src="signup.js"></script>
</body>
</html>
